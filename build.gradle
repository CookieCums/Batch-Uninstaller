// Root build configuration. Keep versions aligned with the legacy Gradle wrapper until CI verifies an upgrade.
buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter() // Read-only fallback for legacy artifacts.
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter() // Read-only fallback for legacy artifacts.
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
